# Exam Resilience Control Tower (ERCT) - Configuration File
# Single source of truth for simulation, detection, readiness, and remedy policies.

database:
  path: "data/erct.db"

exam:
  id: "EX-2026-PS6-01"
  name: "MPOnline Assessment Ecosystem Exam 2026"
  duration_min: 120
  required_version: "4.2.1"
  exam_clock_speed: 1.0

control:
  key: "ctrl-secret-key-2026"

simulation:
  centres: 5
  candidates_per_centre: 40
  heartbeat_interval_s: 2
  flaky_fraction: 0.1
  seed: 36
  restore_boot_delay_s: [2, 20]
  ground_truth_path: "data/ground_truth.jsonl"
  faults:
    - { centre: "C-BPL-02", type: "power_loss", at_s: 300, duration_s: 240, source: "ups", backup_minutes: 0 }
    - { centre: "C-BPL-03", type: "wrong_version" }

centres:
  - id: "C-BPL-01"
    name: "Bhopal North Tech Zone"
    city: "Bhopal"
    vendor: "EduTech Sol"
    capacity: 50
    power_backup: true
    backup_minutes: 60
    software_version: "4.2.1"
    api_key: "key-cbpl01-secret"
  - id: "C-BPL-02"
    name: "Bhopal South Digital Hub"
    city: "Bhopal"
    vendor: "TestMatrix India"
    capacity: 45
    power_backup: true
    backup_minutes: 45
    software_version: "4.2.1"
    api_key: "key-cbpl02-secret"
  - id: "C-BPL-03"
    name: "Bhopal East Assessment Lab"
    city: "Bhopal"
    vendor: "EduTech Sol"
    capacity: 40
    power_backup: true
    backup_minutes: 30
    software_version: "4.2.0" # Mismatched version for readiness gate demo
    api_key: "key-cbpl03-secret"
  - id: "C-BPL-04"
    name: "Bhopal West Online Exam Center"
    city: "Bhopal"
    vendor: "MeritTrac Labs"
    capacity: 60
    power_backup: true
    backup_minutes: 60
    software_version: "4.2.1"
    api_key: "key-cbpl04-secret"
  - id: "C-BPL-05"
    name: "Bhopal Central Institute"
    city: "Bhopal"
    vendor: "TestMatrix India"
    capacity: 50
    power_backup: true
    backup_minutes: 40
    software_version: "4.2.1"
    api_key: "key-cbpl05-secret"

readiness:
  min_score: 70
  weights:
    version: 40
    power_backup: 30
    capacity: 30

detection:
  tick_s: 1.0
  startup_grace_s: 15
  min_active_sessions: 5
  close_fraction: 0.2
  close_ticks: 2
  recovery_resume_fraction: 0.9
  recovery_max_wait_s: 30
  settle_s: 5
  escalate_after_s: 120
  ingest_stall_s: 8
  heartbeat_gap_s: 6
  centre_loss_fraction: 0.6         # 60% of sessions silent within window calls centre outage
  centre_loss_window_s: 10          # Detection window in seconds
  latency_p95_ms: 1500
  anomaly:
    enabled: true
    threshold: 0.9

integrity:
  max_timestamp_skew_s: 15          # Max allowable difference between event ts and ingest time
  login_fail_burst_threshold: 5     # Bursts of login failures indicating brute force / abuse
  seq_gap_threshold: 10             # Sequence gaps indicating dropped or bypassed telemetry

impact:
  heartbeat_interval_s: 2.0      # expected cadence, must match the simulator
  loss_gap_factor: 5             # a gap between consecutive heartbeats longer than factor * interval is real loss, shorter is noise
  stale_hb_factor: 2.5           # last heartbeat older than factor*interval before window_start => evidence partial
  baseline_slots: 10             # interval slots before window_start used to judge heartbeat regularity
  baseline_missing_max: 0.2      # more missing slots than this => evidence partial
  baseline_min_slots: 3          # minimum required slots after session start
  recompute_window_s: 600        # keep refreshing rows that are still 'missing'

remedy:
  resume_max_lost_s: 300
  resume_max_lost_answers: 2
  extra_time_buffer_s: 120
  retest_min_affected_fraction: 0.5

decision:
  controller_key: "demo-controller-key"     # demo only, say so in the README later
  max_extra_seconds: 1800
  min_reason_chars: 10
  allowed_remedies: [resume, extra_time, retest, no_compensation]

fairness:
  min_rows_per_centre: 10
  max_ratio_spread: 1.5          # max(compensation_ratio) / min(compensation_ratio)
  max_manual_review_gap: 0.3     # difference in manual-review share between centres

comms:
  candidate_message_delay_s: 30  # keep; used as the target latency
  display_tz: "Asia/Kolkata"     # only for times inside message text; storage stays UTC

audit:
  anchor_every: 200
  immudb:
    enabled: false
